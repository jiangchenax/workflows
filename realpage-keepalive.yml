name: Real Page Keepalive

on:
  schedule:
    # 每 15 分钟一次，UTC 时间，避开整点
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:
    inputs:
      notify_mode:
        description: "通知模式：change / failure / always / off"
        required: false
        default: "change"
      target_url:
        description: "临时测试 URL，可留空"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: realpage-keepalive
  cancel-in-progress: false

jobs:
  realpage-keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      MANUAL_TARGET_URL: ${{ github.event.inputs.target_url }}
      TARGETS_JSON: ${{ secrets.REALPAGE_TARGETS_JSON }}

      NOTIFY_MODE: ${{ github.event.inputs.notify_mode || vars.NOTIFY_MODE || 'change' }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      DEFAULT_TIMEOUT_MS: "45000"
      DEFAULT_WAIT_UNTIL: "networkidle"
      DEFAULT_MAX_RETRIES: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore keepalive state
        uses: actions/cache/restore@v4
        with:
          path: .realpage_state.json
          key: realpage-state-${{ github.run_id }}
          restore-keys: |
            realpage-state-

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run real page keepalive
        run: |
          node scripts/realpage-keepalive.mjs

      - name: Save keepalive state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .realpage_state.json
          key: realpage-state-${{ github.run_id }}

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realpage-keepalive-report
          path: |
            realpage_report.json
            .realpage_state.json
            screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark workflow failed if page unhealthy
        if: ${{ hashFiles('.realpage_failed') != '' }}
        run: |
          echo "Some real business pages are unhealthy."
          exit 1
