name: Real Page Keepalive

on:
  schedule:
    - cron: "7,22,37,52 * * * *"

  workflow_dispatch:
    inputs:
      notify_mode:
        description: "通知模式：change / failure / always / off"
        required: false
        default: "change"
      target_url:
        description: "临时测试 URL，可留空"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: realpage-keepalive
  cancel-in-progress: false

jobs:
  realpage-keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      MANUAL_TARGET_URL: ${{ github.event.inputs.target_url }}
      TARGETS_JSON: ${{ secrets.REALPAGE_TARGETS_JSON }}

      NOTIFY_MODE: ${{ github.event.inputs.notify_mode || vars.NOTIFY_MODE || 'change' }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      DEFAULT_TIMEOUT_MS: "60000"
      DEFAULT_WAIT_UNTIL: "domcontentloaded"
      DEFAULT_MAX_RETRIES: "2"

      # false：网页失败也不让 GitHub Actions 标红，只在报告和通知里显示
      # true：网页失败就让 GitHub Actions 标红
      STRICT_FAIL: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore keepalive state
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .realpage_state.json
          key: realpage-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            realpage-state-

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run real page keepalive
        run: |
          node scripts/realpage-keepalive.mjs

      - name: Print report for debugging
        if: always()
        run: |
          echo "===== realpage_report.json ====="
          if [ -f realpage_report.json ]; then
            cat realpage_report.json
          else
            echo "realpage_report.json not found"
          fi

          echo ""
          echo "===== failed marker ====="
          if [ -f .realpage_failed ]; then
            cat .realpage_failed
          else
            echo "No failed marker"
          fi

      - name: Ensure state file exists
        if: always()
        run: |
          if [ ! -f .realpage_state.json ]; then
            echo '{"updatedAtUtc":"","targets":{}}' > .realpage_state.json
          fi

      - name: Save keepalive state
        if: always()
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: .realpage_state.json
          key: realpage-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: realpage-keepalive-report
          path: |
            realpage_report.json
            .realpage_state.json
            screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark workflow failed if strict mode enabled
        if: ${{ env.STRICT_FAIL == 'true' && hashFiles('.realpage_failed') != '' }}
        run: |
          echo "真实业务页面检测失败，且 STRICT_FAIL=true，因此标记 workflow 失败。"
          exit 1
